<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #1b1e2b 0%, #2d1b3e 60%, #3a1d3d 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .card { max-width: 420px; width: 100%; }
    .logo {
      width: 76px; height: 76px; margin: 0 auto 22px;
      background: #fff; border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; font-weight: 700; color: #1b1e2b;
    }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
    .sub { font-size: 15px; color: #cfc6e0; line-height: 1.7; margin-bottom: 30px; }
    a.btn {
      display: block; width: 100%;
      background: #ff5c7a; color: #fff;
      font-size: 20px; font-weight: 700;
      padding: 18px 0; border-radius: 14px;
      text-decoration: none; box-shadow: 0 10px 30px rgba(255,92,122,.35);
      transition: transform .15s;
    }
    a.btn:active { transform: scale(.97); }
    .note { margin-top: 22px; font-size: 12px; color: #8f86a8; }
    .age-line { font-size: 13px; color: #b8aed8; margin-bottom: 26px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">18+</div>
    <h1>Welcome</h1>
    <p class="sub">Tap the button below to continue.<br>This is an adult website for users aged 18 and over.</p>
    <a class="btn" id="enterBtn" target="_blank" rel="noopener"
       href="https://go.whitetrafsa.com?userId=b8e26f5282a81cc55c1dd7fb4decbad2956c82f41d82fd7fc3573506e1ce3366">Enter</a>
    <p class="age-line">This page contains no adult content. It is only an access gate.</p>
    <div class="note" id="counterNote"></div>
  </div>

  <script>
    try {
      var c = parseInt(localStorage.getItem("lp_visit") || "0", 10) + 1;
      localStorage.setItem("lp_visit", String(c));
      document.getElementById("counterNote").textContent = "Visits on this device: " + c;
    } catch (e) {}
    document.getElementById("enterBtn").addEventListener("click", function () {
      localStorage.setItem("lp_click", "1");
    });
  </script>
</body>
</html>
