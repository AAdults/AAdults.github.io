<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Now</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      color: #fff;
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(255,92,122,.28), transparent 60%),
        radial-gradient(800px 500px at 10% 110%, rgba(120,60,220,.30), transparent 60%),
        linear-gradient(150deg, #151827 0%, #251737 55%, #311a35 100%);
      display: flex; align-items: center; justify-content: center; text-align: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }
    /* 右上角语言切换：6 种语言一行排开，窄屏自动换行，不会跑出屏幕 */
    .langs {
      position: fixed; top: 14px; right: 12px; z-index: 5;
      display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px;
      max-width: calc(100% - 24px);
    }
    .langs button {
      background: rgba(255,255,255,.10); color: #fff; border: none; border-radius: 7px;
      padding: 4px 8px; cursor: pointer; font-size: 11.5px; line-height: 1.1;
      transition: background .15s ease;
    }
    .langs button:hover { background: rgba(255,255,255,.20); }
    .langs button.active { background: rgba(255,255,255,.28); }
    .card { max-width: 440px; width: 100%; }
    .logo {
      width: 72px; height: 72px; margin: 0 auto 20px;
      background: #fff; border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 38px; font-weight: 700; color: #151827;
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
    }
    h1 { font-size: 30px; font-weight: 800; letter-spacing: .5px; margin-bottom: 12px; }
    .sub { font-size: 15px; color: #cfc6e0; line-height: 1.65; margin-bottom: 24px; }
    .feats { list-style: none; margin: 0 auto 28px; max-width: 330px; text-align: left; }
    .feats li {
      display: flex; align-items: center; gap: 10px;
      font-size: 15px; color: #e6defa; padding: 7px 2px;
    }
    .feats li::before {
      content: "\2713"; width: 22px; height: 22px; flex: 0 0 22px;
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(255,92,122,.20); color: #ff8fa6;
      border-radius: 50%; font-size: 13px; font-weight: 700;
    }
    a.btn {
      display: block; width: 100%;
      background: linear-gradient(135deg, #ff5c7a 0%, #ff7a5c 100%);
      color: #fff; font-size: 21px; font-weight: 800; letter-spacing: .8px;
      padding: 19px 12px; border-radius: 16px; text-decoration: none;
      box-shadow: 0 12px 34px rgba(255,92,122,.45);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    a.btn:active { transform: scale(.97); box-shadow: 0 6px 18px rgba(255,92,122,.35); }
    .mini { margin-top: 22px; font-size: 12.5px; color: #9a90b4; }
    /* 小屏适配：标题别折断成三行，语言按钮再缩一档 */
    @media (max-width: 380px) {
      h1 { font-size: 26px; }
      .sub { font-size: 14px; }
      .langs button { font-size: 11px; padding: 6px 8px; border-radius: 8px; }
    }
  </style>
</head>
<body>
  <div class="langs">
    <button id="ln-en" class="active">EN</button>
    <button id="ln-de">DE</button>
    <button id="ln-fr">FR</button>
    <button id="ln-it">IT</button>
    <button id="ln-es">ES</button>
    <button id="ln-pt">PT</button>
  </div>

  <div class="card">
    <div class="logo">18+</div>
    <h1 id="t_headline">10,000+ Sweet Girls Online</h1>
    <p class="sub" id="t_sub">The sweetest girls show themselves live right now &mdash; pick any one you like. Free to watch.</p>
    <ul class="feats">
      <li id="t_f1">10,000+ models online now</li>
      <li id="t_f2">Pick any one you like</li>
      <li id="t_f3">Free to watch &mdash; instant access</li>
    </ul>
    <a class="btn" id="enterBtn" target="_blank" rel="noopener"
       href="https://bongacams4.com/track?c=843731"
       data-ln-label-en="WATCH NOW" data-ln-label-de="JETZT ANSEHEN" data-ln-label-fr="REGARDER"
       data-ln-label-it="GUARDA ORA" data-ln-label-es="VER AHORA" data-ln-label-pt="ASSISTIR AGORA"
       >WATCH NOW</a>
    <div class="mini" id="t_age">18+ only. Entertainment for adults.</div>
  </div>

  <!-- ===== 到达统计:Google Analytics 4(自动记页面访问 + 按钮点击) ===== -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXX"></script>
  <script>
    // 把下面两个 G-XXXXXXXX 换成你自己的 GA4 测量ID。
    // 还没有?去 https://analytics.google.com 新建一个 “GA4 媒体资源” 就能拿到免费ID。
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXX', { send_page_view: true });
    document.getElementById('enterBtn').addEventListener('click', function(){
      gtag('event', 'lp_join_click', { event_category: 'landing' });
    });
  </script>

  <script>
    // 多语言：6 种（英/德/法/意/西/葡）。默认按浏览器语言，右上角可手动切
    // 文案 = 数字卖点(10,000+ 模特在线) + “最甜的姑娘正在线直播” + “随便挑一个” + WATCH NOW
    var T = {
      en: { h:'10,000+ Sweet Girls Online',
            sub:'The sweetest girls show themselves live right now \u2014 pick any one you like. Free to watch.',
            f1:'10,000+ models online now', f2:'Pick any one you like', f3:'Free to watch \u2014 instant access',
            age:'18+ only. Entertainment for adults.' },
      de: { h:'10.000+ süße Girls online',
            sub:'Die süßesten Girls zeigen sich gerade live \u2014 such dir einfach die aus, die dir gefällt. Ansehen ist kostenlos.',
            f1:'10.000+ Models gerade online', f2:'Such dir eine aus, die dir gefällt', f3:'Kostenlos ansehen \u2014 sofort dabei',
            age:'Nur ab 18 Jahren. Unterhaltung für Erwachsene.' },
      fr: { h:'10 000+ filles en ligne',
            sub:'Les plus belles filles se montrent en direct en ce moment \u2014 choisissez celle que vous voulez. Regarder est gratuit.',
            f1:'10 000+ modèles en ligne maintenant', f2:'Choisissez celle qui vous plaît', f3:'Regarder gratuitement \u2014 accès immédiat',
            age:'Réservé aux 18 ans et plus. Divertissement pour adultes.' },
      it: { h:'Oltre 10.000 ragazze online',
            sub:'Le ragazze più belle si mostrano in diretta proprio ora \u2014 scegli quella che preferisci. Guardare è gratis.',
            f1:'10.000+ modelle online adesso', f2:'Scegli quella che ti piace', f3:'Guarda gratis \u2014 accesso immediato',
            age:'Solo 18+. Intrattenimento per adulti.' },
      es: { h:'Más de 10.000 chicas online',
            sub:'Las chicas más dulces se muestran en vivo ahora mismo \u2014 elige la que quieras. Ver es gratis.',
            f1:'10.000+ modelos online ahora', f2:'Elige la que más te guste', f3:'Ver gratis \u2014 acceso inmediato',
            age:'Solo 18+. Entretenimiento para adultos.' },
      pt: { h:'Mais de 10.000 garotas online',
            sub:'As garotas mais doces estão se mostrando ao vivo agora \u2014 escolha a que quiser. Assistir é grátis.',
            f1:'10.000+ modelos online agora', f2:'Escolha a que mais gostar', f3:'Assistir grátis \u2014 acesso imediato',
            age:'Apenas 18+. Entretenimento para adultos.' }
    };
    var btnEnt = document.getElementById('enterBtn');
    function apply(l){
      var d = T[l] || T.en;
      document.getElementById('t_headline').textContent = d.h;
      document.getElementById('t_sub').textContent = d.sub;
      document.getElementById('t_f1').innerHTML = d.f1;
      document.getElementById('t_f2').textContent = d.f2;
      document.getElementById('t_f3').textContent = d.f3;
      document.getElementById('t_age').textContent = d.age;
      btnEnt.textContent = btnEnt.getAttribute('data-ln-label-' + l) || btnEnt.getAttribute('data-ln-label-en');
      document.documentElement.lang = T[l] ? l : 'en';
      document.querySelectorAll('.langs button').forEach(function(b){
        b.classList.toggle('active', b.id === 'ln-' + l);
      });
    }
    var nav = (navigator.language || 'en').toLowerCase();
    var pick = nav.indexOf('de') === 0 ? 'de'
             : nav.indexOf('fr') === 0 ? 'fr'
             : nav.indexOf('it') === 0 ? 'it'
             : nav.indexOf('es') === 0 ? 'es'
             : nav.indexOf('pt') === 0 ? 'pt' : 'en';
    ['en','de','fr','it','es','pt'].forEach(function(l){
      document.getElementById('ln-' + l).addEventListener('click', function(){
        apply(l);
        try { localStorage.setItem('lp_lang_pick', l); } catch(e){}   // 用户手动点过 → 记住，以后都听他的
      });
    });
    apply(pick);
  </script>
  <!-- ===== 按 IP 国家自动选语言（用户手动点过则以用户为准） ===== -->
  <script>
  (function(){
    var LANGS = ['en','de','fr','it','es','pt'];
    // 国家 → 语言 对照表。没列到的国家一律英文（荷兰/北欧等英语普及率极高，不需要单独做）
    var ES = ['ES','MX','AR','CO','CL','PE','VE','EC','BO','PY','UY','GT','HN','SV','NI','CR','PA','CU','DO','PR','GQ'];
    var PT = ['BR','PT','AO','MZ','CV','GW','ST','TL'];
    var DE = ['DE','AT','CH','LI'];
    var FR = ['FR','MC','SN','CI','CM','BF','ML','NE','TG','BJ','GA','CG','CD','MG'];
    var IT = ['IT','SM'];
    function langOf(cc){
      cc = (cc || '').toUpperCase();
      if (DE.indexOf(cc) >= 0) return 'de';
      if (FR.indexOf(cc) >= 0) return 'fr';
      if (IT.indexOf(cc) >= 0) return 'it';
      if (ES.indexOf(cc) >= 0) return 'es';
      if (PT.indexOf(cc) >= 0) return 'pt';
      return 'en';
    }
    var OK = true;
    try { localStorage.setItem('_t','1'); localStorage.removeItem('_t'); } catch(e){ OK = false; }
    function get(k){ try { return OK ? localStorage.getItem(k) : null; } catch(e){ return null; } }
    function set(k,v){ try { if(OK) localStorage.setItem(k,v); } catch(e){} }
    function use(l){ if (LANGS.indexOf(l) >= 0) apply(l); }

    // 1) 用户手动选过 → 永远以他为尊：既覆盖自动识别，重新打开也记得他的选择
    var manual = get('lp_lang_pick');
    if (manual && LANGS.indexOf(manual) >= 0) { use(manual); return; }

    // 2) 24 小时内的识别结果直接复用（省接口次数、页面更快）
    var cc0 = get('lp_geo_cc'), ts = parseInt(get('lp_geo_ts') || '0', 10);
    if (cc0 && (Date.now() - ts) < 86400000) { use(langOf(cc0)); return; }

    // 3) 两个免费 IP 定位接口依次试，每个 3 秒超时；全失败就保持原来的“浏览器语言”判断
    var APIS = ['https://get.geojs.io/v1/ip/country.json', 'https://api.country.is/'];
    function tryNext(i){
      if (i >= APIS.length) return;
      var done = false;
      var timer = setTimeout(function(){ if (!done) { done = true; tryNext(i+1); } }, 3000);
      fetch(APIS[i], { cache: 'no-store' })
        .then(function(r){ return r.json(); })
        .then(function(d){
          if (done) return; done = true; clearTimeout(timer);
          var cc = d && (d.country || d.country_code);
          if (!cc) { tryNext(i+1); return; }
          set('lp_geo_cc', cc); set('lp_geo_ts', String(Date.now()));
          use(langOf(cc));
        })
        .catch(function(){ if (done) return; done = true; clearTimeout(timer); tryNext(i+1); });
    }
    tryNext(0);
  })();
  </script>
</body>
</html>
